<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Browser-only LiDAR workstation: PotreeConverter, PCL and PDAL compiled to WebAssembly. No server, no upload." />
    <!-- Enables cross-origin isolation (SharedArrayBuffer, pthreads) on static hosts like GitHub Pages. -->
    <script src="./coi-serviceworker.js"></script>
    <title>everything-pointcloud</title>
    <script type="module" crossorigin src="/everything-pointcloud-demo/assets/index-CxPGK4uM.js"></script>
    <link rel="modulepreload" crossorigin href="/everything-pointcloud-demo/assets/three.core-ADT4FCq_.js">
    <link rel="stylesheet" crossorigin href="/everything-pointcloud-demo/assets/index-0M3dt5A8.css">
  </head>
  <body>
    <!-- Full-screen 3D canvas -->
    <div id="viewer"></div>

    <!-- Top bar -->
    <header id="topbar">
      <div class="topbar-left">
        <span class="brand">everything-pointcloud</span>
        <label class="file-btn">
          <input id="potree-file" type="file" accept=".las,.laz" />
          Open LAS
        </label>
        <label class="file-btn file-btn-secondary">
          <input id="ops-file" type="file" accept=".pcd,.xyz,.pts,.txt" />
          Open PCD/XYZ
        </label>
        <button id="load-sample" class="file-btn file-btn-secondary" type="button" title="Open a real LiDAR scan (Manhattan, a rainforest, the Grand Canyon...) — converted entirely in your browser">
          Try a sample
        </button>
      </div>
      <div class="topbar-right">
        <span id="app-status" class="status-badge">Idle</span>
        <span id="potree-stats" class="status-badge stats-badge" style="display:none">
          <span id="potree-visible-points">0</span> pts
          <span class="divider">|</span>
          <span id="potree-progress">0%</span>
        </span>
      </div>
    </header>

    <!--
      The PCD/XYZ in-memory session (processing/basicOps.ts) still reads these
      ids; its panel is not part of the interface (display:none, inert) until a
      PCD/XYZ file converts to an octree and runs through the Effects panel
      (docs/data-model-2026-11-19.md §6 row 13).
    -->
    <div id="legacy-main-refs" hidden inert aria-hidden="true">
      <div id="ops-panel">
        <span id="load-cloud"></span><span id="reset-cloud"></span><span id="apply-voxel"></span>
        <span id="apply-passthrough"></span><span id="apply-segmentation"></span>
        <div id="cloud-summary"></div><div id="segment-summary"></div>
        <input id="leaf-size" type="number" value="0.05" />
        <select id="passthrough-axis"><option value="z" selected>Z</option></select>
        <input id="passthrough-min" type="number" value="-2" /><input id="passthrough-max" type="number" value="2" />
        <input id="segment-distance" type="number" value="0.03" /><input id="segment-iterations" type="number" value="120" />
      </div>
    </div>

    <!-- Floating log (collapsed by default) -->
    <aside id="log-panel" class="floating-panel log-floating" data-hidden data-collapsed>
      <div class="panel-grip" data-panel="log-panel" role="button" tabindex="0" aria-expanded="false" title="Show the full log">Log</div>
      <pre id="potree-log" class="log-body"></pre>
    </aside>

    <!-- Toolbar + tool windows are created programmatically by main.ts -->
    <div id="toolbar-root"></div>
    <div id="panels-root"></div>

  </body>
</html>
